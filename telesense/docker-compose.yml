services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: telesense_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/backend/data/telesense.db
      - ENVIRONMENT=production
    volumes:
      - ./backend/data:/app/backend/data
      - ./ml/saved_models:/app/ml/saved_models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telesense_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
